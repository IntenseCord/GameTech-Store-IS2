[pytest]
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::sqlalchemy.exc.LegacyAPIWarning
    error:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
    error:Passing an extension instance:DeprecationWarning
    error::pytest.PytestDeprecationWarning
    # Se mantiene a propósito: notification_url es el único canal por el que MercadoPago avisa de los pagos
    # a /webhooks/mercadopago en Checkout Pro; quitarlo dejaría las órdenes en "pending" para siempre.
    ignore:notification_url is deprecated:DeprecationWarning
